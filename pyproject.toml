[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawsearch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.41,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
